<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><title>Monkex</title>
  <script src="/shell/locale.js"></script>
  <link rel="stylesheet" href="/shell/styles.css">
</head>
<body>
  <section id="petShell" class="pet-shell" aria-label="Monkex" hidden>
    <button id="petLauncher" class="pet-launcher" type="button" aria-label="Open task board">
      <span class="pet-tree-stage" aria-hidden="true">
      <span id="petCharacter" class="pet-character banana-tree-art" data-frame="idle" aria-hidden="true">
        <img src="/shell/assets/monkey-banana-2026-09-07/banana-tree.png" alt="">
        <span class="tree-canopy">
        <span class="tree-companion"><span class="tree-monkey-sprite"></span></span>
        <span id="petGrowth" class="tree-growth" aria-hidden="true"><i class="tree-green-fruit" hidden></i><i class="tree-green-fruit" hidden></i><i class="tree-green-fruit" hidden></i></span>
        <span id="petHarvest" class="tree-harvest" aria-hidden="true"><i class="tree-fruit" hidden></i><i class="tree-fruit" hidden></i><i class="tree-fruit" hidden></i><i class="tree-fruit" hidden></i><i class="tree-fruit" hidden></i></span>
        </span>
      </span>
      </span>
      <span id="petQuota" class="pet-quota" data-state="unknown"><span>Left</span><strong id="petQuotaRemaining">—</strong></span>
    </button>
  </section>
  <main class="app-shell" id="appShell">
    <header class="topbar">
      <div id="greetMonkey" class="brand-pet" title="This week's harvest"><span id="brandMonkey" class="monkey-art" data-frame="idle" aria-hidden="true"><img src="/shell/assets/monkey-banana-2026-09-07/gold-chain-monkey.png" alt=""></span></div>
      <div class="heading" id="dragArea"><h1><span id="viewHeading" title="Monkex · Codex task board">Monkex</span><i id="connectionDot" class="connection-dot" title="Connecting" aria-label="Connecting"></i></h1><span id="connectionText" class="sr-only">Connecting to Codex</span></div>
      <span id="weeklyQuota" class="weekly-quota" title="Waiting for weekly quota"><span>Weekly</span><strong id="weeklyRemaining">—</strong><button id="quotaCoinButton" class="quota-coin-button" type="button" aria-label="Refresh tasks and quota" title="Click to refresh tasks and quota"><img class="quota-coin" src="/shell/assets/monkex-coins-2026-09-07/banana-coin-v1.png" alt="" aria-hidden="true"></button></span>
      <button id="pinButton" class="pin-button" type="button" aria-pressed="false" aria-label="Pin board" title="Pin board"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pin-shadow" d="M5 21h14" /><g class="pin-art"><path class="pin-needle" d="M12 14v7"/><path class="pin-head" d="M8 3h8v3l-1 1v4l3 3v2H6v-2l3-3V7L8 6z"/><path class="pin-glint" d="M10 5h3"/></g></svg></button>
      <button id="collapseButton" class="icon-button" type="button" aria-label="Collapse to tree" title="Collapse to tree"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5"/></svg></button>
    </header>
    <div id="systemBanner" class="system-banner" role="status" hidden></div>
    <section id="feedView" class="feed-view" aria-label="Tasks across projects">
      <nav class="filters" aria-label="Task views">
        <button data-filter="board" class="filter active" aria-pressed="true" title="Unread from the last 24 hours first, then all running tasks">Board <span id="boardCount">0</span></button>
        <button data-filter="recent" class="filter" aria-pressed="false" title="Unread, read, then running; newest activity first in each group">24 hours <span id="recentCount">0</span></button>
        <button data-filter="history" class="filter" aria-pressed="false" title="Tasks last active between 24 hours and 7 days ago">7 days <span id="historyCount">0</span></button>
      </nav>
      <div id="taskList" class="task-list" aria-label="Task list"><p class="empty-note">Loading recent tasks…</p></div>
      <span id="syncLabel" class="sr-only" aria-live="off"></span>
    </section>
    <div id="readPlayLayer" class="read-play-layer" aria-hidden="true"></div>
    <div id="readPlayToast" class="read-play-toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="/shell/en/banana-tree.js" defer></script>
  <script src="/shell/en/read-play.js" defer></script>
  <script src="/shell/en/task-navigation.js" defer></script>
  <script src="/shell/en/app.js" defer></script>
</body>
</html>
