<div class="workspace"><header class="top"><div class="path"><i class="square"></i><span>Monkex 使用手册</span><span>/</span><span id="breadcrumb">产品概览</span></div><button class="reset" id="reset">↺ 重置演示</button></header><main class="page" id="content" tabindex="-1"></main></div><div class="toast" role="status" id="toast" hidden></div>
<script>
'use strict';
const A={tree:'{{asset:shell/assets/monkey-banana-2026-09-07/banana-tree.png}}',monkey:'{{asset:shell/assets/monkey-banana-2026-09-07/gold-chain-monkey.png}}',ripe:'{{asset:shell/assets/monkey-banana-2026-09-07/pixel-banana-v4-diagonal.png}}',green:'{{asset:shell/assets/monkey-banana-2026-09-07/pixel-banana-green-v1.png}}',peel:'{{asset:shell/assets/monkey-banana-2026-09-07/pixel-banana-peel-v1.png}}',coin:'{{asset:shell/assets/monkex-coins-2026-09-07/banana-coin-v1.png}}',icon:'{{asset:desktop_shell/src-tauri/icons/monkex-giant-banana-v2/128x128@2x.png}}'};
const chapters=[['overview','产品概览'],['tree','桌面香蕉树'],['states','三种任务状态'],['board','任务看板与跳转'],['harvest','收香蕉与本周收成'],['quota','额度与 Token 活跃度'],['pin','固定、收起与退出'],['design','设计语言'],['install','安装与开始使用'],['privacy','数据与功能边界'],['faq','常见问题']];
let route='overview',tab='board',stageState='running',quota=68,quotaMode='normal',pinned=false,pinCollapsed=false,os='mac',pendingTask=null,treeOpened=false,treeExited=false,selectedTitle='',timers=new Set(),toastTimer;
const seed=()=>[{id:1,title:'完成作品集首页',summary:'响应式布局与作品展示已完成',state:'unread',time:'12 分钟前',age:12},{id:2,title:'检查版本发布清单',summary:'安装材料和使用说明已整理',state:'unread',time:'38 分钟前',age:38},{id:3,title:'开发数据看板',summary:'正在实现趋势图表与筛选',state:'running',rate:'124.8k /min',time:'刚刚',age:0},{id:4,title:'补充接口回归测试',summary:'已覆盖正常响应与异常输入',state:'read',time:'2 小时前',age:120},{id:5,title:'整理项目文档',summary:'已有说明保留在 Codex 中',state:'read',time:'3 天前',age:4320}];
let tasks=seed(),harvest=12,collected=new Set();
const $=id=>document.getElementById(id);
const img=(key,cls='',alt='')=>`<img class="pixel ${cls}" src="${A[key]}" alt="${alt}" draggable="false">`;
const pinSvg='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16v6M8 3h8v3l-1 1v4l3 3v2H6v-2l3-3V7L8 6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
function later(fn,ms){const t=setTimeout(()=>{timers.delete(t);fn();},ms);timers.add(t);return t;}
function tree(){return `<div class="tree-unit" style="--banana-tree-image:url('${A.tree}');--banana-image:url('${A.ripe}');--banana-green-image:url('${A.green}')"><span class="banana-tree-art" data-running="true">${img('tree')}<span class="tree-canopy"><span class="tree-companion"><span class="tree-monkey-sprite"></span></span><span class="tree-growth"><i class="tree-green-fruit"></i></span><span class="tree-harvest" data-connected="true"><i class="tree-fruit"></i><i class="tree-fruit"></i></span></span></span><span class="planter">周余<b>${quota}%</b></span></div>`;}
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2800);}
const header=(num,title,lead)=>`<header class="page-head"><div class="eyebrow">${num} / MONKEX HANDBOOK</div><h1>${title}</h1><p class="lead">${lead}</p></header>`;
const rule=(num,title,body)=>`<section class="rule"><span class="rule-number">${num}</span><h2>${title}</h2><p>${body}</p></section>`;
const stage=(content,foot='点击控件，体验当前功能',cls='')=>`<div class="stage ${cls}"><div class="stage-label">INTERACTIVE DEMO · 示例数据</div>${content}<div class="stage-foot"><span>${foot}</span><span>独立演示</span></div></div>`;
function selectedTasks(){return tasks.filter(t=>tab==='board'?(t.state==='unread'&&t.age<1440)||t.state==='running':tab==='recent'?t.age<1440&&t.age>=0:t.age>=1440&&t.state!=='running').sort((a,b)=>{if(tab==='history')return a.age-b.age;const rank=t=>t.state==='unread'?0:t.state==='read'?1:2;return rank(a)-rank(b)||a.age-b.age;});}
function row(t,action='open-task'){return `<button class="task" data-state="${t.state}" data-action="${action}" data-id="${t.id}">${img(t.state==='running'?'green':t.state==='unread'?'ripe':'peel')}<span><strong>${t.title}</strong><small>${t.summary}</small></span><span class="status">${{running:'进行中',unread:'未读',read:'已读'}[t.state]}<br><span class="${t.state==='running'?'rate':''}">${t.state==='running'?t.rate||'0 /min':t.time}</span></span></button>`;}
function board(){return `<div class="board"><div class="board-head"><div class="avatar" id="pocket">${img('monkey')}<span class="pocket">${harvest}</span></div><div class="board-brand">Monkex<i class="board-dot"></i></div><span class="quota-pill">周剩余 <b>${quota}%</b><button class="coin-button" data-action="coin" aria-label="演示刷新额度">${img('coin')}</button></span><button class="pin" data-action="pin" aria-label="${pinned?'拔起图钉':'固定看板'}" aria-pressed="${pinned}">${pinSvg}</button><button class="collapse" data-action="collapse" aria-label="收起示例看板">⌄</button></div><div class="tabs" aria-label="示例任务筛选">${[['board','看板'],['recent','近24小时'],['history','历史7天']].map(([key,label])=>`<button data-action="tab" data-tab="${key}" aria-pressed="${tab===key}">${label}<b>${tasks.filter(t=>key==='board'?(t.state==='unread'&&t.age<1440)||t.state==='running':key==='recent'?t.age<1440:t.age>=1440&&t.state!=='running').length}</b></button>`).join('')}</div><div class="rows">${selectedTasks().map(t=>row(t)).join('')||'<p class="empty">当前待办已看完</p>'}</div></div>`;}
function codexOverlay(){return pendingTask?`<section class="mock-codex" role="dialog" aria-modal="true" aria-label="模拟打开 Codex 原任务"><button class="close-dialog" data-action="dismiss" aria-label="关闭模拟窗口">×</button><div class="eyebrow">CODEX · 跳转示意</div><h3>${selectedTitle}</h3><p>真实产品会打开这个任务的 Codex 原对话。这里仅模拟已进入任务的流程，不会连接你的 Codex。</p><button class="btn primary" data-action="confirm-read">${pendingTask.state==='running'?'返回示例看板':'完成查看，返回看板'}</button></section>`:'';}
const views={
overview:()=>`<section class="hero"><div><div class="eyebrow">A TINY ORCHARD FOR CODEX</div><h1>把 Codex 的进展，<br>种在桌面上。</h1><p class="intro">Monkex 是一个轻量桌面任务看板。<br>忙碌时，看绿蕉生长；完成后，收走黄蕉。<br>需要继续工作时，一点回到原对话。</p><a href="#tree" class="btn primary">从一棵树开始 <span aria-hidden="true">↗</span></a></div><div class="hero-art"><span class="tree-bubble">2 根香蕉，等你来收</span>${tree()}<span class="hero-word">GROW · FINISH · COLLECT</span><span class="hero-caption">运行任务 + 未读结果 + 周额度</span></div></section><div class="quick-map"><a href="#board"><strong>01 看进展 ↗</strong><span>跨项目动态与三种时间范围</span></a><a href="#harvest"><strong>02 收香蕉 ↗</strong><span>查看结果，留下本周收成</span></a><a href="#design"><strong>03 读设计 ↗</strong><span>叶绿、香蕉黄与像素语言</span></a></div><div class="callout">${img('coin')}<span>本手册的任务、额度和收成均为演示数据。可以放心点击，不会读取账户、修改任务或消耗 Token。</span></div>`,
tree:()=>header('01','忙时看进展，闲时一棵树。','启动后出现在主屏工作区右下角。只留树和花盆里的周余额，把大部分屏幕还给你的工作。')+`<div class="split"><div class="explain">${rule('01','按住拖动','抓住树叶、树干或花盆拖动位置。轻微抖动仍按点击处理，真正拖动后松手保持收起。')}${rule('02','轻点展开','点击树，打开紧凑看板。树上的小绿蕉对应进行中任务，发亮的黄蕉提醒你有近期未读结果。')}${rule('03','树上有动静','运行时猴子在树冠探头、跳枝，叶片和香蕉跟随轻晃；没有运行任务时停止工作动效。')}<p class="note">在右侧区域拖动这棵树，或轻点打开示例看板。真实产品的收起窗口为 76 × 76，手册为便于阅读做了放大。</p></div><div>${stage(treeExited?'<button class="btn primary" data-action="restart-tree">重新启动演示</button>':treeOpened?board()+codexOverlay():`<button class="tree-button" id="drag-tree" aria-label="按住拖动示例树，轻点展开">${tree()}</button><div class="context-menu" id="tree-menu" hidden><button data-action="open-tree">展开看板</button><button data-action="exit-tree">退出 Monkex（演示）</button></div>`,'按住拖动 · 轻点展开 · 右键菜单','tree-stage')}<div class="demo-controls"><button class="btn small" data-action="tree-menu">查看右键菜单</button><button class="btn small" data-action="reset-tree">树回到中间</button></div></div></div>`,
states:()=>header('02','用一根香蕉，看懂任务状态。','三个视觉状态，共用一套语言：生长、成熟、收走。运行状态优先，阅读状态随后。')+`<div class="split"><div class="explain">${rule('01','小绿蕉 · 进行中','本机事件显示任务仍在运行。绿香蕉更小，表示尚未成熟；旁边的速率用于辅助感知活动。')}${rule('02','黄香蕉 · 未读','近期任务有新的待看结果。亮黄色与绿色树叶形成区分，提醒你回来看看。')}${rule('03','香蕉皮 · 已读','结果已经查看，香蕉被收走，留下低饱和度香蕉皮。任务再次开始时变成绿蕉，新结果出现后再变成黄蕉。')}<p class="note">“已读”记录查看状态；项目是否通过验收、已发布或正式完成，仍需你在 Codex 中判断。</p></div><div>${stage(`<div class="state-feature">${img({running:'green',unread:'ripe',read:'peel'}[stageState],'fruit-spot '+(stageState==='running'?'small':''))}<h2>${{running:'正在生长',unread:'成熟，等你来看',read:'已经收走'}[stageState]}</h2><p>${{running:'小绿蕉 + 浅绿任务底色，表示正在进行。',unread:'黄蕉 + 浅黄任务底色，表示有新结果待查看。',read:'香蕉皮 + 弱化文本，把注意力留给新任务。'}[stageState]}</p><div class="state-buttons">${[['running','进行中'],['unread','未读'],['read','已读']].map(([s,l])=>`<button data-action="state" data-state="${s}" aria-pressed="${stageState===s}">${l}</button>`).join('')}</div></div>`,'点击状态，观察图形与视觉轻重的变化')}</div></div>`,
board:()=>header('03','只看动态，一点回到 Codex。','看板呈现任务标题、已有进展、阅读状态与速度或时间。完整正文和后续操作继续在 Codex 中完成。')+`<div class="split"><div class="explain">${rule('01','看板','先放近 24 小时未读结果，再放全部确认进行中的任务。已读且未运行的任务会移出这里。')}${rule('02','近24小时 / 历史7天','近24小时依次排列未读、已读、进行中，组内按最近活动倒序。历史7天展示最后活动在 24 小时前至 7 天内的非运行任务。')}${rule('03','点击任务直达原对话','按任务 ID 请求打开对应的 Codex 对话。打开或已读保存失败时保留未读；运行中任务只跳转，不收香蕉。')}<p class="note">时间范围是滚动窗口。超过 7 天从助手隐藏，Codex 原记录保留。列表悬停时尽量保持顺序稳定，避免任务在鼠标下移动。</p></div><div>${stage(board()+codexOverlay(),'点击筛选或任务行，体验示例流程')}<p class="inline-feedback" id="board-message">${selectedTitle?'上次打开：'+selectedTitle:'试试点击黄色任务，看看已读后的变化。'}</p></div></div>`,
harvest:()=>header('04','看过的进展，变成本周收成。','收香蕉是查看结果时的一点反馈。头像角标累计本机自然周内，从看板成功收走的香蕉次数。')+`<div class="split"><div class="explain">${rule('01','点击未读任务','真实产品在系统接受任务跳转、同版本已读回执保存成功后，播放收取反馈。香蕉飞向猴子头像，计数加一。')}${rule('02','按自然周累计','以本机时间周一 00:00 到周日为一周。计数重启保留，新的一周重新开始；同一结果重复查看只计一次。')}${rule('03','轻反馈，默认开启','收蕉动效无需设置开关。系统开启“减少动态效果”时保留静态反馈与计数。失败、运行中任务和后台刷新均不增加收成。')}<p class="note">在 Codex 自己的窗口里查看任务，可同步为已读；这类后台已读同步不会补记为“看板收蕉”。</p></div><div>${stage(`<div class="harvest-demo"><div class="collection-target"><div class="avatar" id="harvest-pocket">${img('monkey')}<span class="pocket" id="harvest-number">${harvest}</span></div><div><h3>本周已收 <span class="mono">${harvest}</span> 根</h3><p>演示初始收成：12 根</p></div></div>${[1,2].map(id=>`<button class="task" data-action="collect" data-id="${id}" data-state="${collected.has(id)?'read':'unread'}" ${collected.has(id)?'disabled':''}>${img(collected.has(id)?'peel':'ripe')}<span><strong>${id===1?'作品集首页已完成':'使用说明已整理'}</strong><small>${collected.has(id)?'同一结果只计一次':'点击，模拟成功查看并收蕉'}</small></span><span class="status">${collected.has(id)?'已读':'未读'}</span></button>`).join('')}<p class="inline-feedback" id="harvest-feedback">${collected.size===2?'本批示例香蕉收齐了。':'点击黄香蕉所在的任务行。'}</p></div>`,'这里直接模拟成功回执，不打开真实任务')}</div></div>`,
quota:()=>header('05','额度是真实比例，金币是活动提示。','树下保持一个简洁百分比；展开看板后，圆形香蕉币缓慢旋转，让活跃的 Token 消耗更容易被感知。')+`<div class="split"><div class="explain">${rule('01','绿色 → 黄色 → 红色','剩余超过 50% 用绿色；大于 20% 且不超过 50% 用黄色；20% 及以下用红色。没有可靠额度时显示“—”。')}${rule('02','轻点香蕉币刷新','金币轻弹，并主动刷新任务快照与周额度。旋转只提示已观测到消耗；一枚金币不代表固定 Token 数或费用。')}${rule('03','短暂失败，保留有效观测','任务流重连不会清空有效额度。额度请求短暂失败时保留 90 秒有效期内的上次结果，提示原同步时间并自动重试；过期或已过重置时间显示待同步。')}<p class="note">任务行的 /min 是近 60 秒日志 Token 用量速率，包含缓存输入；它与文字生成速度、周额度百分比和账单费用分别计算。下方滑杆仅用于手册演示。</p></div><div>${stage(`<div class="quota-demo"><span class="quota-pill" id="quota-display" data-tone="${quotaMode==='expired'?'unknown':quota<=20?'low':quota<=50?'medium':'normal'}"><span>周剩余</span><b id="quota-value">${quotaMode==='expired'?'—':quota+'%'}</b><button class="coin-button" data-action="quota-refresh" aria-label="演示香蕉币刷新">${img('coin')}</button></span><label class="range-label" for="quota-range">拖动，预览不同剩余额度的颜色</label><input id="quota-range" type="range" min="0" max="100" value="${quota}" aria-label="演示剩余额度百分比"><div class="thresholds"><span>≤20% 红</span><span>21–50% 黄</span><span>>50% 绿</span></div><div class="state-buttons"><button data-action="quota-mode" data-mode="normal" aria-pressed="${quotaMode==='normal'}">正常</button><button data-action="quota-mode" data-mode="retry" aria-pressed="${quotaMode==='retry'}">短暂中断</button><button data-action="quota-mode" data-mode="expired" aria-pressed="${quotaMode==='expired'}">结果已过期</button></div><p class="inline-feedback" id="quota-feedback">${quotaMode==='retry'?'保留上次有效观测，原时间戳不变，5 秒后自动重试。':quotaMode==='expired'?'额度已失效。点击香蕉币，模拟重新取得真实结果。':'香蕉币缓慢旋转。点击它，试试刷新反馈。'}</p><p class="sample-quota muted">示例额度，与任何真实账户无关</p></div>`,'仅看板提供金币反馈；收起态没有进度条')}</div></div>`,
pin:()=>header('06','想常看就钉住，想安静就收起。','一个图钉控制看板是否跟随窗口切换自动收起。退出入口留在桌面树的右键菜单里。')+`<div class="split"><div class="explain">${rule('01','图钉拔起','切换到其他应用窗口时，未固定看板自动收成香蕉树。看板内部按钮切换焦点不会触发收起。')}${rule('02','图钉按下','黄色图钉表示固定。切换窗口后仍保持展开；你也可以点击右上角收起按钮手动收成树。')}${rule('03','双击启动，右键退出','运行时 Mac 不占 Dock，Windows 窗口不占任务栏；桌面或开始菜单的启动入口保留。退出请右键香蕉树选择“退出 Monkex”。')}<p class="note">当前没有开机自启。这里的“启动默认右下角”指每次打开应用时的位置；用户自行固定的系统快捷方式保持原样。</p></div><div>${stage(`<div class="pin-stage">${pinCollapsed?`<button style="border:0;background:none" data-action="restore-board" aria-label="展开示例树">${tree()}</button>`:board()}<button class="other-window" data-action="outside">点击这里 · 模拟切换到其他窗口</button></div>`,'试试图钉按下与拔起，两种状态有何不同')}<p class="inline-feedback">${pinCollapsed?'未固定：示例看板已自动收起。轻点树可以展开。':pinned?'已固定：切换窗口将保持展开。':'未固定：切换窗口将自动收起。'}</p></div></div>`,
design:()=>header('07','一套从生长到收成的视觉语言。','像素角色负责趣味，简约界面负责清晰。绿色承接运行状态，黄色把注意力留给新的进展。')+`<div class="design-intro"><div class="design-principles"><section><h3>01 · 用生长描述工作</h3><p>小绿蕉 → 成熟黄蕉 → 香蕉皮，让任务状态从文字变成可辨识的物件。树负责承载动态，花盆自然容纳周额度。</p></section><section><h3>02 · 用像素保留性格</h3><p>猴子、香蕉和金币沿用产品的像素素材。图形使用清晰边缘，正文用系统字体，保证小窗口里仍能快速阅读。</p></section><section><h3>03 · 把动作放在有意义的地方</h3><p>运行时树冠有反馈，查看结果时收蕉，额度有消耗时金币缓转。减少动态偏好始终受到尊重。</p></section></div><div>${img('icon','app-icon','Monkex 应用图标：绿叶中的猴子抱着香蕉')}<p class="muted" style="text-align:center;font-size:11px;margin-top:17px">当前产品图标 · ImageGen 素材</p></div></div><h2>颜色各有职责</h2><div class="palette"><div class="swatch" style="background:#183b27;color:#fff"><b>深叶绿 · 文字</b><span>#183B27</span></div><div class="swatch" style="background:#e5f4e8"><b>浅叶绿 · 运行</b><span>#E5F4E8</span></div><div class="swatch" style="background:#ffd33d"><b>香蕉黄 · 反馈</b><span>#FFD33D</span></div><div class="swatch" style="background:#f2f8ed"><b>叶白 · 窗口</b><span>#F2F8ED</span></div></div><div class="design-bottom"><section><h2>轻外壳，紧凑信息</h2><p>收起窗口 76 × 76；看板宽 344px，高度随内容在 180–420px 内变化。圆角与细边界划出一个轻量窗口，内部状态图形保持像素风格。</p></section><section><h2>短动作，慢旋转</h2><p>金币约 12 秒转一圈，保留图案的可读性。点击提供短促反馈，连贯的动作服务于操作确认。</p><div class="motion-sample">${img('coin')}<button data-action="motion">试试轻弹反馈</button></div></section></div>`,
install:()=>header('08','连接你自己的 Codex，开始使用。','Monkex 面向已有 Codex 桌面环境的用户。安装包内置后端，普通用户无需安装 Python、Node.js 或 Rust。')+`<div class="split install"><div class="explain"><div class="setup-tabs"><button class="btn small" data-action="os" data-os="mac" aria-pressed="${os==='mac'}">Mac · M 系列</button><button class="btn small" data-action="os" data-os="windows" aria-pressed="${os==='windows'}">Windows · x64</button></div><ol class="steps"><li><b>先安装并登录 Codex</b><span>确认你能正常打开自己的任务。Monkex 使用当前系统用户的本机 Codex 历史。</span></li><li><b>找到对应的公开安装包</b><span>${os==='mac'?'选择 macOS arm64 ZIP，解压完整 Monkex.app。':'选择 Windows x64 setup.exe 安装器。'}下载前阅读版本说明并核验 SHA256。</span></li><li><b>${os==='mac'?'放入“应用程序”，双击打开':'按安装器提示完成安装'}</b><span>${os==='mac'?'核验来源后，由你确认系统的未公证提示。':'安装到当前用户；缺少 WebView2 时，安装器会尝试联网补齐。'}保持系统安全保护开启。</span></li><li><b>从右下角的树开始</b><span>等待首次同步，轻点树查看任务。后续回复、审批和执行都在 Codex 中完成。</span></li></ol><a class="btn primary" href="https://github.com/zxzin/Monkex/releases" target="_blank" rel="noopener">查看 GitHub 发行附件 ↗</a><p class="note" style="margin-top:18px">下载以 Releases 实际可见附件为准；草稿无法供普通用户下载。暂无 Intel Mac、Windows ARM64、Linux 对应包。预览包未完成 Mac 公证与 Windows 发行者签名，Windows 真实 Codex 集成仍需实机验收。</p></div><section class="prompt-box"><span class="eyebrow">INSTALL WITH CODEX</span><h2>把这段话发给 Codex</h2><pre id="install-prompt"></pre><button class="btn yellow" data-action="copy-prompt">复制安装提示词</button><p class="inline-feedback" id="copy-result" role="status">需要可操作本机文件与应用的 Codex 环境。</p></section></div>`,
privacy:()=>header('09','数据留在本机，工作继续在 Codex。','Monkex 的职责是观察进展、定位任务、记录已读。它让已有工作更容易被看见。')+`<div class="local-flow"><div>本机 Codex<small>已有任务与结构化运行记录</small></div><span>→</span><div>Monkex<small>看板 · 已读 · 本周收成</small></div><span>→</span><div>原任务窗口<small>继续输入、回复与审批</small></div></div><div class="boundary"><section><h2>接入与保留</h2><ul><li><strong>读取当前用户的数据</strong><span>遵循现有 CODEX_HOME；不同电脑、独立用户目录使用各自的任务，安装包不包含作者任务。</span></li><li><strong>本机保存阅读与收成</strong><span>已读游标和自然周收蕉次数保存在系统应用数据目录，重启后保留。</span></li><li><strong>仅在回环地址提供服务</strong><span>后端监听 127.0.0.1:8766。Monkex 自身无分析埋点或远程上传服务。</span></li><li><strong>在 Codex 查看也能同步已读</strong><span>依赖兼容的本地记录与结果版本；不兼容时保留状态，不根据鼠标停留猜测阅读。</span></li></ul></section><section><h2>明确的功能边界</h2><ul><li><strong>执行权保留在 Codex</strong><span>新建任务、回复、审批、停止和执行均回到原任务处理。</span></li><li><strong>展示已有进展文本</strong><span>额外 AI 总结已移除，Monkex 不为生成任务说明调用模型。</span></li><li><strong>账户按本机目录接入</strong><span>同一系统用户共享多账号历史时，不进行云账号级二次分离；当前没有跨设备云同步。</span></li><li><strong>让界面保持简单</strong><span>没有搜索、类型筛选、左侧大对话框和动效设置开关；也没有自动更新或开机自启。</span></li></ul></section></div>`,
faq:()=>header('10','有疑问，从这里找答案。','这些说明对应当前 Preview 的功能与限制。先核验实际状态，保留原任务与用户数据。')+`<div>${[
['周余额为什么显示“—”？','首次查询未完成、观测超过 90 秒、已过重置时间，或 Codex 没有返回可靠周窗口时，会显示待同步。展开后点击香蕉币重试。短暂任务流重连不会清空有效额度；短暂额度请求失败会自动重试并保留有效期内的观测。'],
['为什么金币不转，Token 速率是 0？','只在运行任务有近期、正数的 Token 用量观测时转动；刚启动尚未形成采样、近期没有新用量、任务结束或系统开启减少动态时会停止。0 /min 不单独代表任务已经停止。'],
['为什么标题下面的文字不像 AI 总结？','看板直接展示 Codex 已有任务标题和进展文本，额外 AI 总结功能已经移除。完整内容请点击任务回到 Codex 阅读。'],
['我在 Codex 看过了，为什么没有增加收蕉数？','Codex 内部已读同步与看板收蕉分开统计。自然周收成只累计从看板成功收取的结果；同一结果重复确认不会累计。若本地已读格式不兼容，Monkex 会保留原状态。'],
['为什么看板切到别的窗口就消失？','图钉拔起时会自动收成树，这是预期行为。按下黄色图钉可固定看板。点击右上角收起按钮始终可以主动收起。'],
['任务跳转失败或结果还没显示，怎么办？','保留未读，检查 Codex 是否安装、登录并注册 codex://threads/… 路由。系统接受打开请求不等于目标内容已经渲染；请确认实际落点。不要批量点击来排障。'],
['不同用户下载后需要绑定作者的账号吗？','使用下载者当前系统用户自己的 Codex 环境，无需作者账户。非标准安装路径可设置 MONKEX_CODEX_PATH。若同一用户目录混合了多个账户的历史，Monkex 按目录读取，不自动拆分。'],
['怎么退出、更新或卸载？','右键桌面树选择“退出 Monkex”。更新前退出旧版并保留应用备份与用户数据；以公开发行附件为准。卸载只处理明确的 Monkex 应用文件，清理用户数据前单独确认并备份，保留 Codex 数据。'],
['下载页没有对应安装包怎么办？','公开源码与公开安装包是不同状态。以 GitHub Releases 实际附件为准；缺少匹配系统或架构的公开包时暂停安装。普通用户无需默认尝试源码编译。']
].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div><div class="callout">${img('monkey')}<span>需要反馈问题？记录系统、版本、操作步骤和可脱敏截图，再前往 <a href="https://github.com/zxzin/Monkex/issues" target="_blank" rel="noopener">GitHub Issues ↗</a>。请勿附带凭据或私人任务正文。</span></div>`
};
const prompt=`请帮我安装 Monkex：https://github.com/zxzin/Monkex 。
先读取仓库 README、INSTALL_WITH_CODEX.md 和公开 Releases，识别本机系统及 CPU 架构，下载对应的最新公开安装包（可选 Preview），核验 SHA256，保留已有用户数据并安装。
检查并连接我自己的本机 Codex。没有匹配包时暂停说明，不默认源码编译。不读取或上传凭据，不修改 Codex 配置。
遇到未签名／未公证警告、登录或管理员授权时，先解释并让我确认，不关闭系统安全保护。
最后报告安装版本、路径、启动方式和实际验证结果。`;
function render({focus=false}={}){timers.forEach(clearTimeout);timers.clear();document.querySelectorAll('.flying').forEach(e=>e.remove());const index=chapters.findIndex(c=>c[0]===route);$('breadcrumb').textContent=chapters[index][1];document.title=`${chapters[index][1]} · Monkex 交互手册`;$('content').innerHTML=views[route]()+`<footer class="chapter-foot"><button data-action="previous" ${index===0?'disabled':''}>← 上一章</button><span class="mono">${String(index+1).padStart(2,'0')} / ${chapters.length} · MONKEX HANDBOOK</span><button data-action="next" ${index===chapters.length-1?'disabled':''}>下一章 →</button></footer>`;document.querySelectorAll('.nav a').forEach(a=>{if(a.hash==='#'+route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});if($('install-prompt'))$('install-prompt').textContent=prompt;if($('quota-range'))$('quota-range').oninput=e=>{quota=Number(e.target.value);quotaMode='normal';updateQuota();};bindTree();if(focus)$('content').focus({preventScroll:true});}
function updateQuota(){const node=$('quota-display');if(!node)return;node.dataset.tone=quotaMode==='expired'?'unknown':quota<=20?'low':quota<=50?'medium':'normal';$('quota-value').textContent=quotaMode==='expired'?'—':quota+'%';$('quota-feedback').textContent='示例剩余 '+quota+'%。点击香蕉币可模拟刷新。';document.querySelectorAll('[data-action=quota-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===quotaMode)));}
function navigate(value){location.hash=value;}
function bounce(el){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;el.animate([{transform:'scale(1)'},{transform:'translateY(-5px) scale(1.1)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'});}
function bindTree(){const el=$('drag-tree');if(!el)return;let press=null,moved=false;el.onpointerdown=e=>{if(e.button!==0)return;press={id:e.pointerId,x:e.clientX,y:e.clientY,left:el.offsetLeft,top:el.offsetTop};moved=false;el.setPointerCapture(e.pointerId);e.preventDefault();};el.onpointermove=e=>{if(!press)return;const dx=e.clientX-press.x,dy=e.clientY-press.y;if(!moved&&Math.hypot(dx,dy)<4)return;moved=true;const box=el.parentElement;el.style.left=Math.max(4,Math.min(box.clientWidth-el.offsetWidth-4,press.left+dx))+'px';el.style.top=Math.max(40,Math.min(box.clientHeight-el.offsetHeight-35,press.top+dy))+'px';};const end=()=>{if(press&&el.hasPointerCapture(press.id))el.releasePointerCapture(press.id);press=null;};el.onpointerup=end;el.onpointercancel=end;el.onclick=e=>{if(e.detail&&moved)return;treeOpened=true;render();};el.oncontextmenu=e=>{e.preventDefault();$('tree-menu').hidden=false;};el.ondragstart=e=>e.preventDefault();}
function showCodex(id){if(route==='pin'){notify('任务跳转请在「任务看板与跳转」章节体验。');return;}pendingTask=tasks.find(t=>t.id===id);selectedTitle=pendingTask.title;render();const dialog=document.querySelector('.mock-codex');dialog.querySelector('.close-dialog').focus();}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
if(action==='previous'||action==='next'){const i=chapters.findIndex(c=>c[0]===route);navigate(chapters[i+(action==='next'?1:-1)][0]);}
else if(action==='state'){stageState=b.dataset.state;render();}
else if(action==='tab'){tab=b.dataset.tab;render();}
else if(action==='open-task'){showCodex(Number(b.dataset.id));}
else if(action==='dismiss'){pendingTask=null;render();document.querySelector(`[data-action="open-task"][data-id="${tasks.find(t=>t.title===selectedTitle)?.id}"]`)?.focus();}
else if(action==='confirm-read'){if(pendingTask.state==='unread'){pendingTask.state='read';harvest++;notify('示例结果已读，本周收成 +1');}else notify('运行中任务只打开，不增加收成');pendingTask=null;render();}
else if(action==='pin'){pinned=!pinned;render();notify(pinned?'演示看板已固定':'已拔起图钉');}
else if(action==='collapse'){if(route==='tree'){treeOpened=false;render();}else if(route==='pin'){pinCollapsed=true;render();}else{notify('真实产品此时收成树。这里跳到收起演示。');pinCollapsed=true;navigate('pin');}}
else if(action==='outside'){pinCollapsed=!pinned;render();notify(pinned?'图钉已按下：保持展开':'未固定：自动收成树');}
else if(action==='restore-board'){pinCollapsed=false;render();}
else if(action==='coin'){bounce(b);notify('演示：重新读取任务与额度，不消耗你的 Token');}
else if(action==='open-tree'){treeOpened=true;render();}
else if(action==='exit-tree'){treeExited=true;render();notify('仅退出本页演示，真实 Monkex 不受影响');}
else if(action==='restart-tree'||action==='reset-tree'){treeOpened=false;treeExited=false;render();}
else if(action==='tree-menu'){treeOpened=false;treeExited=false;render();$('tree-menu').hidden=false;}
else if(action==='collect'){const id=Number(b.dataset.id);if(collected.has(id))return;collected.add(id);harvest++;const start=b.querySelector('img').getBoundingClientRect(),end=$('harvest-pocket').getBoundingClientRect();b.disabled=true;const flight=document.createElement('img');flight.src=A.ripe;flight.className='pixel flying';flight.style.left=start.x+'px';flight.style.top=start.y+'px';document.body.append(flight);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const dx=end.x-start.x,dy=end.y-start.y;flight.animate([{transform:'translate(0,0) scale(.8)',opacity:1},{transform:`translate(${dx*.35}px,${dy*.65-30}px) scale(1.1)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.25)`,opacity:0}],{duration:720,easing:'ease-in-out',fill:'forwards'});later(()=>{render();bounce($('harvest-pocket'));},740);}else{flight.remove();render();}notify('本周收成 +1 · 示例计数');}
else if(action==='quota-mode'){quotaMode=b.dataset.mode;render();}
else if(action==='quota-refresh'){bounce(b);b.disabled=true;$('quota-feedback').textContent='正在刷新示例额度…';later(()=>{quotaMode='normal';render();$('quota-feedback').textContent='示例刷新完成，剩余 '+quota+'%。真实刷新保持账户返回的百分比。';},700);}
else if(action==='motion'){bounce(b.previousElementSibling);}
else if(action==='os'){os=b.dataset.os;render();}
else if(action==='copy-prompt'){try{await navigator.clipboard.writeText(prompt);$('copy-result').textContent='已复制。发给可操作本机的 Codex 即可。';}catch{const range=document.createRange();range.selectNodeContents($('install-prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);$('copy-result').textContent='文本已选中，请按 ⌘C 或 Ctrl+C 复制。';}}
});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('.mock-codex');if(dialog){if(e.key==='Escape'){pendingTask=null;render();}if(e.key==='Tab'){const buttons=[...dialog.querySelectorAll('button')],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}else if(e.key==='Escape'&&$('tree-menu'))$('tree-menu').hidden=true;});
$('reset').onclick=()=>{tasks=seed();harvest=12;collected=new Set();tab='board';stageState='running';quota=68;quotaMode='normal';pinned=false;pinCollapsed=false;pendingTask=null;treeOpened=false;treeExited=false;selectedTitle='';render();notify('演示已重置，真实 Monkex 数据未受影响');};
$('navigation').innerHTML=chapters.map(([id,title],i)=>`${[0,1,7,8].includes(i)?`<div class="nav-group">${{0:'WELCOME',1:'FEATURES',7:'DESIGN',8:'GET STARTED'}[i]}</div>`:''}<a href="#${id}"><span>${String(i).padStart(2,'0')}</span>${title}</a>`).join('');
document.querySelectorAll('[data-asset]').forEach(el=>el.src=A[el.dataset.asset]);
function onRoute(){const key=location.hash.slice(1);if(key==='content'){$('content').focus();return;}route=chapters.some(c=>c[0]===key)?key:'overview';pendingTask=null;render({focus:!!key});window.scrollTo(0,0);}
window.addEventListener('hashchange',onRoute);onRoute();
</script>
</body></html>
