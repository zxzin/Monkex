name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: monkex-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            binary: build/monkex/dist/monkex-backend.exe
          - os: macos-14
            bundle: app
            binary: build/monkex/dist/monkex-backend
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pyinstaller==6.19.0
      - run: npm ci --prefix desktop_shell
      - name: Python regression tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_monkex_platform.py
          for suite in activity runtime token_meter weekly_quota; do
            python -m unittest discover -s tests -p "test_work_twin_${suite}.py" || exit 1
          done
      - name: UI regression tests
        shell: bash
        run: for suite in tests/*.cjs; do node "$suite" || exit 1; done
      - run: python scripts/build_monkex_release.py
      - run: python scripts/smoke_monkex_backend.py "${{ matrix.binary }}" desktop_shell/src-tauri/release-web
      - working-directory: desktop_shell
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundle }}
      - name: Install and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_monkex_windows.ps1
      - name: Archive macOS app preserving permissions
        if: runner.os == 'macOS'
        run: |
          python scripts/finalize_monkex_macos.py
          ditto -c -k --sequesterRsrc --keepParent desktop_shell/src-tauri/target/release/bundle/macos/Monkex.app Monkex-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Monkex-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop_shell/src-tauri/target/release/bundle/nsis/*-setup.exe
            Monkex-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Monkex-*
          path: collected
      - name: Prepare public release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          windows_installer="$(find collected -type f -name '*-setup.exe' -print -quit)"
          macos_archive="$(find collected -type f -name 'Monkex-macOS.zip' -print -quit)"
          test -n "$windows_installer"
          test -n "$macos_archive"
          mkdir release-assets
          cp "$windows_installer" release-assets/Monkex-Windows-x64-setup.exe
          cp "$macos_archive" release-assets/Monkex-macOS-arm64.zip
          cd release-assets
          sha256sum Monkex-Windows-x64-setup.exe Monkex-macOS-arm64.zip > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Monkex $GITHUB_REF_NAME Preview" \
            --prerelease \
            --notes "Windows x64 and macOS Apple Silicon preview installers. Both platform jobs passed the Python and UI regressions plus packaged-backend smoke tests. Windows additionally passed a current-user NSIS install and launch smoke test. The Windows package remains unsigned and the macOS app remains ad-hoc signed and unnotarized; review the installation guide before acknowledging platform security prompts."
