name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            binary: build/monkex/dist/monkex-backend.exe
          - os: macos-14
            bundle: app
            binary: build/monkex/dist/monkex-backend
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pyinstaller==6.19.0
      - run: npm ci --prefix desktop_shell
      - name: Python regression tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_monkex_platform.py
          for suite in activity runtime summaries token_meter weekly_quota; do
            python -m unittest discover -s tests -p "test_work_twin_${suite}.py" || exit 1
          done
      - name: UI regression tests
        shell: bash
        run: for suite in tests/*.cjs; do node "$suite" || exit 1; done
      - run: python scripts/build_monkex_release.py
      - run: python scripts/smoke_monkex_backend.py "${{ matrix.binary }}" desktop_shell/src-tauri/release-web
      - working-directory: desktop_shell
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundle }}
      - name: Archive macOS app preserving permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent desktop_shell/src-tauri/target/release/bundle/macos/Monkex.app Monkex-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Monkex-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop_shell/src-tauri/target/release/bundle/nsis/*-setup.exe
            Monkex-macOS.zip
