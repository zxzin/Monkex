[package]
name = "zinx-work-twin"
version = "0.1.0"
description = "Always-on-top desktop pet shell for the Zinx work twin."
authors = ["zin"]
edition = "2021"

[lib]
name = "zinx_work_twin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zinx-work-twin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["macos-private-api"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
